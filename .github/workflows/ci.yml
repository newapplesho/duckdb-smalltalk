name: CI

run-name: "[${{ github.event.repository.name }}] Check: ${{ github.event_name == 'schedule' && 'scheduled' || github.event.pull_request.title }}"

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 21 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # The job reads the public duckdb/duckdb releases through gh release download.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # CI tests DuckDB 1.x on every supported Pharo version and DuckDB 2.x on Pharo 14 only.
        include:
          - { smalltalk: Pharo64-12, duckdb: 1.5.6 }
          - { smalltalk: Pharo64-13, duckdb: 1.5.6 }
          - { smalltalk: Pharo64-14, duckdb: 1.5.6 }
          - { smalltalk: Pharo64-14, duckdb: 2.0.0 }
    name: ${{ matrix.smalltalk }} / DuckDB ${{ matrix.duckdb }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download DuckDB library
        env:
          DUCKDB_VERSION: ${{ matrix.duckdb }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # DuckDB renamed the Linux release file in 2.0.0:
          #   1.x: libduckdb-linux-amd64.zip
          #   2.x: duckdb-shared-libs-linux-amd64.tar.gz
          # This step downloads the file through the GitHub API (gh release download).
          # The github.com/.../releases/download/ URL returned HTTP 504 for over a minute
          # in CI on 2026-11-08, even with curl --retry.
          case "$DUCKDB_VERSION" in
            1.*) asset=libduckdb-linux-amd64.zip ;;
            *)   asset=duckdb-shared-libs-linux-amd64.tar.gz ;;
          esac
          for attempt in 1 2 3; do
            gh release download "v${DUCKDB_VERSION}" -R duckdb/duckdb \
              -p "$asset" -D /tmp --clobber && break
            [ "$attempt" = 3 ] && exit 1
            sleep 15
          done
          case "$asset" in
            *.zip) unzip "/tmp/$asset" libduckdb.so -d lib/ ;;
            *)     tar xzf "/tmp/$asset" -C lib/ libduckdb.so ;;
          esac
          echo "DUCKDB_LIB_PATH=${{ github.workspace }}/lib/libduckdb.so" >> $GITHUB_ENV

      - name: Setup smalltalkCI
        uses: hpi-swa/setup-smalltalkCI@c0a3a3b942ac515b6c3846ca2f65802d353757ef # 1.6.3
        with:
          smalltalk-image: ${{ matrix.smalltalk }}

      - name: Verify DuckDB library
        run: |
          ls -la lib/libduckdb.so
          ldd lib/libduckdb.so

      - name: Run tests
        run: smalltalkci -s ${{ matrix.smalltalk }}
        timeout-minutes: 15

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results-${{ matrix.smalltalk }}-duckdb-${{ matrix.duckdb }}
          path: '*.xml'
          if-no-files-found: ignore
